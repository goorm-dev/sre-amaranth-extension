<!doctype html>
<meta charset="utf-8">
<title>구름 근무시간</title>
<link rel="stylesheet" href="popup.css">
<div class="wrap">
  <header>
    <button id="prevM" class="nav">‹</button>
    <span id="monthLabel">—</span>
    <button id="nextM" class="nav">›</button>
  </header>

  <section class="hero">
    <div class="lbl">남은 근무시간</div>
    <div class="val" id="remaining">—</div>
    <div class="sub" id="feasibility"></div>
  </section>

  <section class="plan" id="plan"></section>

  <section class="rows" id="rows"></section>

  <section class="planner">
    <div class="calbar">
      <span>근무 계획</span>
      <button id="clearPlans" class="link">전체 해제</button>
    </div>
    <div class="calhead"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="cal" id="cal"></div>
    <div class="caledit" id="caledit" hidden>
      <span id="editDay"></span>
      <input id="editHours" type="number" step="0.5" min="0" max="16">
      <span class="unit">시간</span>
      <button id="editApply" class="primary">적용</button>
      <button id="editClear">해제</button>
    </div>
    <div class="callegend">
      <span><i class="lg-plan"></i>계획</span>
      <span><i class="lg-leave"></i>휴가</span>
      <span><i class="lg-brk"></i>휴게</span>
      <span><i class="lg-done"></i>마감</span>
    </div>
  </section>

  <p class="hint" id="hint"></p>

  <div id="leaveSheet" class="lvsheet" hidden>
    <div class="lvcard">
      <b>휴가 신청</b>
      <select id="lvType">
        <option value="annual">연차 (종일)</option>
        <option value="amHalf">오전반차</option>
        <option value="pmHalf">오후반차</option>
        <option value="annualComp">연차(보상)</option>
        <option value="amHalfComp">오전반차(보상)</option>
        <option value="pmHalfComp">오후반차(보상)</option>
      </select>
      <input id="lvDate" type="date">
      <input id="lvStart" type="time">
      <label class="lvchk"><input id="lvBreak" type="checkbox"> 휴게 1시간 포함</label>
      <div id="lvSpan" class="lvspan"></div>
      <button id="lvGo" class="primary">신청서 열고 채우기</button>
      <div class="lvnote">폼만 채웁니다. <b>신청완료·결재상신은 직접</b> 누르세요.</div>
      <button id="lvClose" class="lvx">닫기</button>
    </div>
  </div>

  <details id="settings">
    <summary>설정</summary>
    <label>하루 소정근로 <input id="daily" type="number" step="0.5" min="1" max="12"> 시간</label>
    <label>유연근무 최소 <input id="minFlex" type="number" step="0.5" min="0" max="12"> 시간</label>
    <label>휴게시간 <input id="breakMin" type="number" step="10" min="0" max="180"> 분</label>
    <label class="wide">추가 휴무일 (YYYY-MM-DD, 쉼표 구분)
      <textarea id="holAdd" rows="2" placeholder="2026-09-30"></textarea>
    </label>
    <label class="wide">휴일 해제 (근무일로 취급)
      <textarea id="holRemove" rows="2" placeholder="2026-05-01"></textarea>
    </label>
    <div class="btns"><button id="save" class="primary">저장</button></div>
    <div class="saved" id="saved"></div>
  </details>

  <section class="links">
    <button id="lvOpen" class="go primary">휴가 신청</button>
    <button data-open="LEAVE_LIST" class="go">신청 현황</button>
    <button data-open="WORKTIME" class="go">근무시간</button>
  </section>

  <div id="updateBar" class="updatebar" hidden></div>

  <footer>
    <button id="refresh" class="link">새로고침</button>
    <span id="stamp"></span>
  </footer>
</div>
<script src="lib/time.js"></script>
<script src="lib/holidays.js"></script>
<script src="lib/gwapi.js"></script>
<script src="lib/store.js"></script>
<script src="lib/calc.js"></script>
<script src="lib/updater.js"></script>
<script src="lib/leaveform.js"></script>
<script src="popup.js"></script>
