# 공개 인그레스로 나가지만, 이 페이지는 회사 그룹웨어 ID/PW 를 입력받는다.
# 접근 제한(사내망 IP 화이트리스트 또는 SSO)을 걸 수 있으면 거는 편이 낫다.
# 아래 nginx.ingress.kubernetes.io/whitelist-source-range 주석을 참고.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: worktime-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt   # TODO: 클러스터에 맞게
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/whitelist-source-range: "1.2.3.0/24"   # 사내 대역만 열려면
spec:
  ingressClassName: public-ingress                # TODO: 실제 IngressClass 이름
  tls:
    - hosts: [worktime.goorm.io]                  # TODO: 실제 호스트
      secretName: worktime-web-tls
  rules:
    - host: worktime.goorm.io                     # TODO: 실제 호스트
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worktime-web
                port:
                  name: http
