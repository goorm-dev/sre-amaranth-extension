# internal-public ALB 그룹에 합류한다.
# 인증서(*.goorm.io)와 scheme 은 default/public-ingress 가 들고 있다.
#
# 주의: 이 페이지는 회사 그룹웨어 ID/PW 를 입력받는다. 토큰은 브라우저 안에만 있고
# 서버로 가지 않지만, 공개 노출이라 형태상 피싱 페이지와 구분되지 않는다.
# 클러스터에 oauth2-proxy/keycloak 이 이미 있으니 앞단에 붙이는 편이 안전하다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: worktime-web
  namespace: worktime
  annotations:
    alb.ingress.kubernetes.io/group.name: internal-public
    alb.ingress.kubernetes.io/group.order: "120"
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "3"
spec:
  ingressClassName: alb
  rules:
    - host: worktime.goorm.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worktime-web
                port:
                  name: http
