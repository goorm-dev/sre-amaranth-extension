# 구름 근무시간 — 정적 웹앱 (아마란스 근태 조회 · 휴가 신청)
#
# 백엔드가 없다. nginx 가 정적 파일만 서빙하고, 브라우저가 gw.goorm.io 를 직접 부른다.
# 자격증명은 이 서버를 거치지 않는다.
apiVersion: v1
kind: Namespace
metadata:
  name: worktime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worktime-web
  namespace: worktime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worktime-web
  template:
    metadata:
      labels:
        app: worktime-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # nginx 이미지의 nginx 사용자
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: 879684891358.dkr.ecr.ap-northeast-2.amazonaws.com/goorm/worktime-web:latest
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:         # readOnlyRootFilesystem 이라 쓰기 경로만 tmpfs 로 준다
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 64Mi }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
