# 백엔드가 없는 정적 사이트다. 상태도 볼륨도 없다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worktime-web
  labels:
    app.kubernetes.io/name: worktime-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worktime-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worktime-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # nginx 이미지의 nginx 사용자
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: REGISTRY/worktime-web:1.1.1   # TODO: 사내 레지스트리 경로로
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:                        # readOnlyRootFilesystem 이라 쓰기 경로만 tmpfs
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 64Mi }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: worktime-web
spec:
  selector:
    app.kubernetes.io/name: worktime-web
  ports:
    - name: http
      port: 80
      targetPort: http
