server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 로그인 폼이 있는 공개 페이지다. 최소한의 방어는 걸어 둔다.
    include /etc/nginx/conf.d/security-headers.conf;

    # 브라우저는 <link rel=icon> 이 있어도 /favicon.ico 를 찔러 본다. 404 를 없앤다.
    location = /favicon.ico {
        include /etc/nginx/conf.d/security-headers.conf;
        alias /usr/share/nginx/html/icons/icon-192.png;
        access_log off;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # index.html·매니페스트는 캐시하지 않는다. 배포하면 바로 반영돼야 한다.
    location ~ ^/(index\.html)?$|^/manifest\.webmanifest$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    # 파일명에 해시가 없어서 캐시가 남으면 "고쳤는데 그대로" 가 반복된다.
    # 정적 자산이 몇십 KB 뿐이라 그냥 캐시하지 않는다. 이미지·폰트만 짧게 잡는다.
    location ~* \.(png|ico|woff2?)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
