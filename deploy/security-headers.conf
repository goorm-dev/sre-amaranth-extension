# nginx 의 add_header 는 상속이 아니라 "하위에 add_header 가 하나라도 있으면 상위를
# 전부 버린다". 그래서 헤더를 넣는 location 마다 이 파일을 include 해야 한다.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
# 인라인 스크립트·스타일이 하나도 없어서 unsafe-inline 없이 잠글 수 있다.
# connect-src 는 아마란스만 연다.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://gw.goorm.io; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
